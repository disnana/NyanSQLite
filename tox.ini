[tox]
envlist = py39, py310, py311, py312, py313, lint, type, test, test-speed
skipsdist = true

[testenv]
deps = -e .[dev]
commands = pytest -v --tb=short

[testenv:lint]
description = Run ruff linter
deps = ruff>=0.8.0
commands = ruff check src/nyansqlite tests --output-format=github

[testenv:type]
description = Run mypy type checker
deps = 
    mypy>=1.13.0
    apsw
    pydantic
commands = mypy src/nyansqlite --no-strict-optional

[testenv:format]
description = Format code with ruff
deps = ruff>=0.8.0
commands = ruff format src/nyansqlite tests

[testenv:fix]
description = Auto-fix linting issues
deps = ruff>=0.8.0
commands = ruff check src/nyansqlite tests --fix

[testenv:test]
description = Run pytest test suite
deps =
    -e .[dev]
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    pytest -v --tb=short --cov=nyansqlite --cov-report=xml:coverage.xml --cov-report=term-missing

[testenv:test-speed]
description = Run pytest with speed extras (orjson path)
deps =
    -e .[dev,speed]
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    pytest -v --tb=short -k ""
