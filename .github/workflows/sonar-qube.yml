name: SonarQube Cloud analysis

# 無効化中: SONAR_TOKEN が SonarQube Cloud に拒否されるため自動実行を停止。
# 再開する場合は有効なトークンを設定し、push / pull_request トリガーを戻す。
on:
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov pytest-asyncio pytest-xdist apsw pydantic cryptography orjson lru-dict
          python -m pip install -e ".[dev]"
      - name: Run tests for coverage
        run: |
          python -m pytest --cov=nyansqlite --cov-report=xml:coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dproject.settings=.github/sonar-project.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
