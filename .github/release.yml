changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: "🚀 New Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "🧪 Testing & CI"
      labels:
        - tests
        - ci
    - title: "📝 Documentation"
      labels:
        - documentation
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "🔄 Other Changes"
      labels: ["*"]
