# Python <3.11 resolutions in uv.lock cannot move to patched releases (fixes need Python 3.11+).
# They are dev/optional dependencies only; Python 3.11+ resolves patched versions.

[[PackageOverrides]]
name = "filelock"
version = "3.19.1"
ecosystem = "PyPI"
ignore = true
reason = "Python <3.11-only dev/optional resolution; patched versions require Python 3.11+"

